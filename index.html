<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My OS</title>
    <link rel="stylesheet" href="index-styles.css">
    <script src="https://kit.fontawesome.com/46f827a615.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght,GRAD@0,17..18,400..700,-50..200;1,17..18,400..700,-50..200&display=swap" rel="stylesheet">

</head>

<body>

    <div class="top_bar">
        <p>WebOS</p>
        <p id="datetime">14.3.2026 18:00</p>
    </div>
    <div id="welcome" class="window">
        <div id="welcome-header" class="window-header">
            <p>Welcome</p>
            <i class="fa-solid fa-xmark close-btn" onclick="closeWindow('welcome')"></i>
        </div>
        <h1>Welcome to My OS</h1>
        <p>This is a simple operating system I built using HTML, CSS, and JavaScript.</p>
    </div>

    <div id="sylable" class="window">
        <div id="sylable-header" class="window-header">
            <p>Nanosoft Sylable</p>
            <i class="fa-solid fa-xmark close-btn" onclick="closeWindow('sylable')"></i>

        </div>
        <h1>Nanosoft Sylable</h1>
        <p>This is an app built for typing and text editing.</p>
        <button class="sylable-button" onclick="generatePDF()" id="Savebutton"><i class="fa-solid fa-save"></i>Save</button>
        <button class="sylable-button" id="Boldbutton" onmousedown="event.preventDefault()" onclick="toggleBold(document.getElementById('Typearea'))"><i class="fa-solid fa-bold"></i>Bold</button>
        <br>
        <div id="Typearea" contenteditable="true">Type here...</div>
    </div>

    <div id="Tic-Tac-Toe" class="window">
        <div id="Tic-Tac-Toe-header" class="window-header">
            <p>Tic-Tac-Toe</p>
            <i class="fa-solid fa-xmark close-btn" onclick="closeWindow('Tic-Tac-Toe')"></i>
        </div>
        <iframe src="https://someguest4.github.io/Tic-Tac-Toe" frameborder="10px" id="ttt-iframe"></iframe>
    </div>
    <div class="bottom-bar">
        <img src="Welcome-icon.png" alt="welcome icon" class="bottom-bar-icon"onclick="openWindow('welcome')">
        <img src="nanosoft-sylable-icon.png" alt="nanosoft sylable icon" class="bottom-bar-icon" onclick="openWindow('sylable')">
        <img src="tic-tac-toe-icon.png" alt="tic-tac-toe icon" class="bottom-bar-icon" onclick="openWindow('Tic-Tac-Toe')">

    </div>

    <script src="index-script.js"></script>
</body>

</html>
